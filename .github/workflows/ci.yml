name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck + testes + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      # O build valida o que o typecheck não pega: rotas duplicadas, uso de
      # API de servidor em componente cliente, imports quebrados.
      - name: Build
        run: npm run build
