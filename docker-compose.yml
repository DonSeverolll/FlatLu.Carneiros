services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carneiros_flat
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Os arquivos rodam em ordem alfabética na primeira subida do volume.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
